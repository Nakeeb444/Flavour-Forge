      // ---- src/components/recipes/categories.js ----
      // Every recipe has one primary browsing category, even if it has several tags.
      // Cuisine filters are also available alongside those type-based categories.
      const RECIPE_CATEGORIES = [
        "Vegetarian",
        "Non-Vegetarian",
        "Starters",
        "Indian",
        "Italian",
        "Chinese",
        "Desserts",
        "Ice Cream",
        "Chocolate",
      ];

      function recipeCategory(recipe) {
        const tags = recipe.tags ?? [];
        if (tags.includes("Non-Vegetarian")) return "Non-Vegetarian";
        if (tags.includes("Ice Cream")) return "Ice Cream";
        if (tags.includes("Chocolate")) return "Chocolate";
        if (tags.includes("Desserts")) return "Desserts";
        if (tags.includes("Starters")) return "Starters";
        if (recipe.cuisine === "Italian") return "Italian";
        if (recipe.cuisine === "Chinese") return "Chinese";
        if (tags.includes("Vegetarian")) return "Vegetarian";
        return "Indian";
      }

      function recipeMatchesCategory(recipe, category) {
        return (
          recipeCategory(recipe) === category ||
          recipe.cuisine === category ||
          (recipe.tags ?? []).includes(category)
        );
      }

      function productArtwork(emoji, name, productId) {
        const key = `${productId ?? name}:${name}`;
        let hash = 2166136261;
        for (let index = 0; index < key.length; index += 1) {
          hash = Math.imul(hash ^ key.charCodeAt(index), 16777619);
        }
        const hue = Math.abs(hash) % 360;
        const pattern = Math.abs(hash >>> 8) % 4;
        const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="hsl(${hue} 78% 94%)"/><stop offset="1" stop-color="hsl(${(hue + 36) % 360} 78% 82%)"/></linearGradient></defs><rect width="160" height="160" rx="28" fill="url(#g)"/><circle cx="${28 + (Math.abs(hash) % 105)}" cy="${24 + (Math.abs(hash >>> 4) % 110)}" r="${12 + (Math.abs(hash >>> 12) % 18)}" fill="white" fill-opacity=".32"/><path d="${pattern === 0 ? "M0 125 Q42 95 82 126 T160 120 V160 H0Z" : pattern === 1 ? "M0 30 Q55 62 90 28 T160 36 V0 H0Z" : pattern === 2 ? "M0 145 Q50 115 100 140 T160 130 V160 H0Z" : "M0 0 Q50 28 100 0 T160 25 V0Z"}" fill="hsl(${(hue + 20) % 360} 67% 62%)" fill-opacity=".42"/><text x="80" y="91" text-anchor="middle" dominant-baseline="middle" font-size="67">${emoji || "🥬"}</text></svg>`;
        return `data:image/svg+xml,${encodeURIComponent(svg)}`;
      }

        return (

            className={`flex shrink-0 items-center justify-center overflow-hidden border border-orange-100 bg-gradient-to-br from-orange-50 to-brand-100 shadow-inner ${dimensions[size] ?? dimensions.md}`}
          >
            {productId != null ? (
              // eslint-disable-next-line @next/next/no-img-element
              <img

      const POSITIONS = [
        { left: 41, top: 1 },
        { left: 1, top: 13 },
        { left: 79, top: 13 },
        { left: 0, top: 41 },
        { left: 80, top: 41 },
        { left: 1, top: 69 },
        { left: 79, top: 69 },
        { left: 22, top: 85 },
        { left: 61, top: 85 },
      ];
      const SHORT_SLOTS = {
        1: [0],
        2: [1, 2],
        3: [0, 1, 2],
        4: [1, 2, 5, 6],
        5: [0, 1, 2, 5, 6],
        6: [0, 1, 2, 3, 4, 7],
        7: [0, 1, 2, 3, 4, 5, 6],
        8: [0, 1, 2, 3, 4, 5, 6, 7],
      };

      function IngredientNode({
        ingredient,
        factor,
        active,
        onSelect,
        onAdd,
        position,
        index,
        animated = false,
      }) {
        const fromX = (50 - position.left) * 5;
        const fromY = (50 - position.top) * 4;
        return (
          <div
            className={`flex min-w-0 items-center gap-2 rounded-full border bg-white/95 p-1.5 shadow-[0_6px_20px_rgba(0,0,0,0.11)] backdrop-blur transition-[border-color,box-shadow] duration-500 ${animated ? "flow-node-enter" : ""} ${active ? "border-brand-400 shadow-[0_8px_28px_rgba(249,115,22,0.26)]" : "border-white/80"}`}
            style={
              animated
                ? {
                    position: "absolute",
                    left: `${position.left}%`,
                    top: `${position.top}%`,
                    width: 174,
                    "--fx": `${fromX}px`,
                    "--fy": `${fromY}px`,
                    "--delay": `${250 + index * 110}ms`,
                    zIndex: 10,
                  }
                : undefined
            }
          >
            <button
              onClick={onSelect}
              aria-label={`View ${ingredient.name} options`}
              className="flex min-w-0 flex-1 items-center gap-2 text-left"

                aria-label={ingredient.name}

                {ingredient.emoji}

              <span className="min-w-0">
                <span className="block truncate text-[12px] font-bold text-ink">

                <span className="block truncate text-[11px] text-stone-500">
                  {scaleQuantity(ingredient.quantity, factor)}
                </span>
              </span>
            </button>
            <button
              onClick={onAdd}
              aria-label={`Add ${ingredient.name}`}
              className="flex h-7 w-7 shrink-0 items-center justify-center rounded-full bg-brand-500 text-white hover:bg-brand-600"
            >
              <PlusIcon width={14} height={14} />
            </button>
          </div>
        );
      }

      function IngredientFlow({
        recipe,
        factor,
        selectedIngredientId,
        onSelectIngredient,
        onAddIngredient,
      }) {
        const items = recipe.ingredients;
        const slots = SHORT_SLOTS[items.length] ?? POSITIONS.map((_, i) => i);
        const visible = items.slice(0, 9);
        const node = (ingredient, index, animated) => (
          <IngredientNode
            key={ingredient.id}
            ingredient={ingredient}
            factor={factor}
            active={selectedIngredientId === ingredient.ingredientId}
            onSelect={() => onSelectIngredient(ingredient.ingredientId)}
            onAdd={() => onAddIngredient(ingredient)}
            position={POSITIONS[slots[index] ?? index]}
            index={index}
            animated={animated}
          />
        );

        return (
          <section aria-label="Recipe ingredient flowchart" className="mt-5">
            <div
              key={recipe.id}
              className="relative hidden h-[560px] w-full overflow-hidden rounded-[24px] bg-gradient-to-br from-orange-50/60 via-white to-amber-50/60 lg:block"
            >
              <div className="flow-halo pointer-events-none absolute left-1/2 top-1/2 h-[440px] w-[440px] rounded-full bg-[radial-gradient(circle,rgba(253,186,116,0.4),transparent_70%)]" />
              <div className="flow-orbit pointer-events-none absolute left-1/2 top-1/2 h-[380px] w-[380px] rounded-full border-2 border-dashed border-orange-200/70" />
              <svg
                aria-hidden="true"
                className="pointer-events-none absolute inset-0 h-full w-full"
              >
                {visible.map((ingredient, index) => {
                  const point = POSITIONS[slots[index] ?? index];
                  return (
                    <line
                      key={ingredient.id}
                      x1="50%"
                      y1="50%"
                      x2={`${point.left + 8}%`}
                      y2={`${point.top + 5}%`}
                      stroke="#fb923c"
                      strokeOpacity="0.62"
                      strokeWidth="1.5"
                      strokeDasharray="4 5"
                      className="flow-line-enter"
                      style={{ "--delay": `${200 + index * 110}ms` }}
                    />
                  );
                })}
              </svg>
              <div className="flow-dish-enter absolute left-1/2 top-1/2 h-[332px] w-[332px] overflow-hidden rounded-full border-[8px] border-white shadow-[0_22px_55px_rgba(75,37,16,0.24)]">
                {/* eslint-disable-next-line @next/next/no-img-element */}
                <img
                  src={recipe.image}
                  alt={recipe.name}
                  className="h-full w-full object-cover"
                />
              </div>
              {visible.map((ingredient, index) =>
                node(ingredient, index, true),
              )}
            </div>
            <div className="lg:hidden">
              <div className="aspect-[16/10] overflow-hidden rounded-2xl bg-orange-50">
                {/* eslint-disable-next-line @next/next/no-img-element */}
                <img
                  src={recipe.image}
                  alt={recipe.name}
                  className="h-full w-full object-cover"
                />
              </div>
              <div className="mt-3 grid gap-2 sm:grid-cols-2">
                {items.map((ingredient, index) =>
                  node(ingredient, index, false),
                )}
              </div>
            </div>
          </section>
        );
      }

      // ---- src/components/recipes/RecipeDetail.jsx ----
      const TABS = ["About", "Ingredients", "Instructions", "Nutrition"];

      function RecipeDetail({
        recipe,
        loading,
        servings,
        onServings,
        selectedIngredientId,
        onSelectIngredient,
        onAddIngredient,
        onAddProduct,
        onBuyAll,
        onToggleFavorite,
        onHome,
        onRecipes,
      }) {
        const [tab, setTab] = useState("About");

        const factor = recipe ? servings / recipe.servings : 1;
        const estimate = useMemo(() => {
          if (!recipe) return 0;
          return recipe.ingredients.reduce((s, i) => {
            const p = i.products.find((x) => x.isDefault) ?? i.products[0];
            return s + (p ? p.price * Math.max(1, Math.ceil(factor)) : 0);
          }, 0);
        }, [recipe, factor]);

        const selectedIngredient = recipe?.ingredients.find(
          (ingredient) => ingredient.ingredientId === selectedIngredientId,
        );

      // ---- src/components/account/CheckoutAuthModal.jsx ----
      function CheckoutAuthModal({ onClose, onAuthenticated, onOpenTerms }) {
        const [acceptTerms, setAcceptTerms] = useState(false);
        const [mode, setMode] = useState("register");
        const [fullName, setFullName] = useState("");
        const [email, setEmail] = useState("");
        const [password, setPassword] = useState("");
        const [error, setError] = useState("");
        const [loading, setLoading] = useState(false);

        async function submit(event) {
          event.preventDefault();
          setError("");
          if (mode === "register" && !acceptTerms) {
            setError("Please accept the Terms & Conditions to continue.");
            return;
          }
          setLoading(true);
          try {
            const response = await fetch(`/api/auth/${mode}`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ fullName, email, password, acceptTerms }),
            });
            const data = await response.json();
            if (!response.ok || !data.user) {
              setError(
                data.error ??
                  "We couldn’t verify those details. Please try again.",
              );
              return;
            }
            onAuthenticated(data.user);
          } catch {
            setError("Connection issue. Please try again in a moment.");
          } finally {
            setLoading(false);
          }
        }

        return (
          <div
            className="fixed inset-0 z-[80] grid place-items-center overflow-y-auto bg-stone-950/35 px-4 py-6 backdrop-blur-sm"
            onMouseDown={(event) => {
              if (event.target === event.currentTarget) onClose();
            }}
          >
            <section
              role="dialog"
              aria-modal="true"
              aria-labelledby="checkout-auth-title"
              className="animate-sheet-in relative w-full max-w-[460px] rounded-[28px] border border-white/70 bg-[#fffdf9] p-6 shadow-[0_28px_100px_rgba(50,30,15,0.25)] sm:p-8"
            >
              <button
                onClick={onClose}
                aria-label="Close account form"
                className="absolute right-4 top-4 rounded-full p-2 text-stone-500 transition hover:bg-orange-50 hover:text-ink"
              >
                <CloseIcon width={19} height={19} />
              </button>

              <div className="flex h-12 w-12 items-center justify-center rounded-2xl bg-orange-100 text-brand-600">
                <ChefHatIcon width={26} height={26} />
              </div>
              <p className="mt-5 text-xs font-bold uppercase tracking-[0.18em] text-brand-600">
                Flavour Forge · checkout
              </p>
              <h2
                id="checkout-auth-title"
                className="font-display mt-1 text-[30px] font-bold leading-tight text-ink"
              >
                {mode === "register"
                  ? "A little more flavour."
                  : "Welcome back."}
              </h2>
              <p className="mt-2 max-w-sm text-sm leading-relaxed text-stone-600">
                {mode === "register"
                  ? "Create your free account to place this order and keep your recipes and orders together."
                  : "Sign in to continue to your order and see your saved recipes."}
              </p>

              <div className="mt-6 grid grid-cols-2 rounded-xl bg-orange-50 p-1">
                {["register", "login"].map((item) => (
                  <button
                    key={item}
                    type="button"
                    onClick={() => {
                      setMode(item);
                      setError("");
                    }}
                    className={`rounded-lg px-3 py-2 text-sm font-semibold transition-colors duration-300 ${
                      mode === item
                        ? "bg-white text-brand-700 shadow-sm"
                        : "text-stone-500 hover:text-ink"
                    }`}
                  >
                    {item === "register" ? "Create account" : "Sign in"}
                  </button>
                ))}
              </div>

              <form onSubmit={submit} className="mt-5 space-y-4">
                {mode === "register" && (
                  <label className="block">
                    <span className="mb-1.5 block text-sm font-semibold text-stone-700">
                      Your name
                    </span>
                    <input
                      autoComplete="name"
                      required
                      minLength={2}
                      maxLength={80}
                      value={fullName}
                      onChange={(e) => setFullName(e.target.value)}
                      placeholder="e.g. Ayesha Khan"
                      className="w-full rounded-xl border border-orange-100 bg-white px-4 py-3 text-sm outline-none transition duration-300 placeholder:text-stone-400 focus:border-brand-400 focus:ring-4 focus:ring-orange-100"
                    />
                  </label>
                )}
                <label className="block">
                  <span className="mb-1.5 block text-sm font-semibold text-stone-700">
                    Email address
                  </span>
                  <input
                    autoComplete="email"
                    type="email"
                    required
                    maxLength={254}
                    value={email}
                    onChange={(e) => setEmail(e.target.value)}
                    placeholder="you@example.com"
                    className="w-full rounded-xl border border-orange-100 bg-white px-4 py-3 text-sm outline-none transition duration-300 placeholder:text-stone-400 focus:border-brand-400 focus:ring-4 focus:ring-orange-100"
                  />

      const SHOW_AFTER_PX = 180;

      function useScrollDock() {
        const [visible, setVisible] = useState(false);

        useEffect(() => {
          let frame = 0;
          const update = () => {
            if (frame) return;
            frame = window.requestAnimationFrame(() => {
              setVisible(window.scrollY > SHOW_AFTER_PX);
              frame = 0;
            });
          };
          update();
          window.addEventListener("scroll", update, { passive: true });
          return () => {
            window.removeEventListener("scroll", update);
            window.cancelAnimationFrame(frame);
          };
        }, []);

        return visible;
      }

      // ---- src/components/layout/App.jsx ----
      function subscribeToTheme(onChange) {
        const observer = new MutationObserver(onChange);
        observer.observe(document.documentElement, {
          attributes: true,
          attributeFilter: ["class"],
        });
        return () => observer.disconnect();
      }

      function getThemeSnapshot() {
        return document.documentElement.classList.contains("dark")
          ? "dark"
          : "light";
      }

      function App({ initialRecipes, initialRecipe, initialCart }) {
        const [view, setView] = useState("home");
        const dockVisible = useScrollDock();
        const navigate = useCallback((nextView) => {
          setView(nextView);
          window.scrollTo({ top: 0, behavior: "smooth" });
        }, []);
        const [search, setSearch] = useState("");
        const [filter, setFilter] = useState("Vegetarian");
        const [recipes, setRecipes] = useState(initialRecipes);
        const [recipe, setRecipe] = useState(initialRecipe);
        const [recipeOpen, setRecipeOpen] = useState(false);
        const [loadingRecipe, setLoadingRecipe] = useState(false);
        const [servings, setServings] = useState(initialRecipe?.servings ?? 4);
        const [selectedIngredientId, setSelectedIngredientId] = useState(
          initialRecipe?.ingredients.find((i) => i.slug === "tomato")
            ?.ingredientId ??
            initialRecipe?.ingredients[0]?.ingredientId ??
            null,
        );
        const [cart, setCart] = useState(initialCart);
        const [busy, setBusy] = useState(false);
        const [orders, setOrders] = useState([]);
        const [shopProducts, setShopProducts] = useState([]);
        const [user, setUser] = useState(null);
        const [authChecked, setAuthChecked] = useState(false);
        const [authOpen, setAuthOpen] = useState(false);
        const [termsOpen, setTermsOpen] = useState(false);
        const theme = useSyncExternalStore(
          subscribeToTheme,
          getThemeSnapshot,
          () => "light",
        );

        const toggleTheme = useCallback(() => {
          const next = theme === "dark" ? "light" : "dark";
          document.documentElement.classList.toggle("dark", next === "dark");
          document.documentElement.style.colorScheme = next;
          try {
            localStorage.setItem("ff-theme", next);
          } catch {}
        }, [theme]);
        const [toasts, setToasts] = useState([]);
        const toastId = useRef(0);

        const toast = useCallback((message) => {
          const id = ++toastId.current;
          setToasts((current) => [...current, { id, message }]);
          window.setTimeout(
            () =>
              setToasts((current) => current.filter((item) => item.id !== id)),
            3300,
          );
        }, []);

        useEffect(() => {
          let alive = true;
          fetch("/api/auth/me", { cache: "no-store" })
            .then((response) => response.json())
            .then((data) => {
              if (alive) setUser(data.user);
            })
            .catch(() => {})
            .finally(() => {
              if (alive) setAuthChecked(true);
            });
          return () => {
            alive = false;
          };
        }, []);

        useEffect(() => {
          if (view === "orders" || view === "profile") {
            fetch("/api/orders", { cache: "no-store" })
              .then((r) => r.json())
              .then(setOrders)
              .catch(() => {});
          }
          if (view === "shop" && shopProducts.length === 0) {
            fetch("/api/products")
              .then((r) => r.json())
              .then(setShopProducts)
              .catch(() => {});
          }
        }, [view, shopProducts.length, user?.id]);

        useEffect(() => {
          if (!recipeOpen) return;
          const onKeyDown = (event) => {
            if (event.key === "Escape") setRecipeOpen(false);
          };
          window.addEventListener("keydown", onKeyDown);
          return () => window.removeEventListener("keydown", onKeyDown);
        }, [recipeOpen]);

        const filtered = useMemo(() => {
          const query = search.trim().toLowerCase();
          return recipes.filter((item) => {
            const matchesFilter = query || recipeMatchesCategory(item, filter);
            const matchesSearch =
              !query ||
              item.name.toLowerCase().includes(query) ||
              item.description.toLowerCase().includes(query) ||
              item.cuisine.toLowerCase().includes(query) ||
              item.tags.some((tag) => tag.toLowerCase().includes(query)) ||
              item.ingredientNames.some((ingredient) =>
                ingredient.toLowerCase().includes(query),
              );
            return matchesFilter && matchesSearch;
          });
        }, [recipes, filter, search]);

        const selectRecipe = useCallback(
          async (slug) => {
            if (recipe?.slug === slug) {
              setRecipeOpen(true);
              return;
            }
            setLoadingRecipe(true);
            try {
              const response = await fetch(`/api/recipes/${slug}`);
              if (!response.ok) throw new Error("Recipe request failed");
              const data = await response.json();
              setRecipe(data);
              setServings(data.servings);
              setSelectedIngredientId(
                data.ingredients.find((item) => item.slug === "tomato")
                  ?.ingredientId ??
                  data.ingredients[0]?.ingredientId ??
                  null,
              );
              setRecipeOpen(true);
            } catch {
              toast("Could not load this recipe. Please try again.");
            } finally {
              setLoadingRecipe(false);
            }
          },
          [recipe?.slug, toast],
        );

        const toggleFavorite = useCallback(
          async (recipeId) => {
            setRecipes((items) =>
              items.map((item) =>
                item.id === recipeId
                  ? { ...item, isFavorite: !item.isFavorite }
                  : item,
              ),
            );
            setRecipe((item) =>
              item && item.id === recipeId
                ? { ...item, isFavorite: !item.isFavorite }
                : item,
            );
            try {
              const response = await fetch("/api/favorites", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ recipeId }),
              });
              if (!response.ok) throw new Error("Favorite request failed");
              const data = await response.json();
              setRecipes((items) =>
                items.map((item) =>
                  item.id === recipeId
                    ? { ...item, isFavorite: data.isFavorite }
                    : item,
                ),
              );
              setRecipe((item) =>
                item && item.id === recipeId
                  ? { ...item, isFavorite: data.isFavorite }
                  : item,
              );
              toast(
                data.isFavorite
                  ? "Saved to your favourites"
                  : "Removed from favourites",
              );
            } catch {
              setRecipes((items) =>
                items.map((item) =>
                  item.id === recipeId
                    ? { ...item, isFavorite: !item.isFavorite }
                    : item,
                ),
              );
              setRecipe((item) =>
                item && item.id === recipeId
                  ? { ...item, isFavorite: !item.isFavorite }
                  : item,
              );
              toast("Could not update favourites.");
            }
          },
          [toast],
        );

        const cartRequest = useCallback(
          async (input, init, successMessage) => {
            setBusy(true);
            try {
              const response = await fetch(input, {
                headers: { "Content-Type": "application/json" },
                ...init,
              });
              if (!response.ok) throw new Error("Cart request failed");
              const data = await response.json();
              setCart(data);
              if (successMessage) toast(successMessage);
              return data;
            } catch {
              toast("Could not update your cart. Please try again.");
            } finally {
              setBusy(false);
            }
          },
          [toast],
        );

        const addProduct = useCallback(
          (productId, quantity = 1, label) =>
            cartRequest(
              "/api/cart",
              { method: "POST", body: JSON.stringify({ productId, quantity }) },
              label ? `${label} added to cart` : "Added to cart",
            ),
          [cartRequest],
        );

        const addIngredient = useCallback(
          (ingredient) => {
            const product =
              ingredient.products.find((item) => item.isDefault) ??
              ingredient.products[0];
            if (!product) return;
            setSelectedIngredientId(ingredient.ingredientId);
            addProduct(product.id, 1, product.name);
          },
          [addProduct],
        );

        const factor = recipe ? servings / recipe.servings : 1;

        const buyAll = useCallback(async () => {
          if (!recipe) return;
          const result = await cartRequest(
            "/api/cart",
            {
              method: "POST",
              body: JSON.stringify({ recipeId: recipe.id, servings }),
            },
            `${recipe.name} added as a complete recipe kit`,
          );
          if (result) {
            setRecipeOpen(false);
            navigate("cart");
          }
        }, [recipe, servings, cartRequest, navigate]);

        const placeOrder = useCallback(async () => {
          setBusy(true);
          try {
            const response = await fetch("/api/orders", { method: "POST" });
            if (response.status === 401) {
              setAuthOpen(true);
              return;
            }
            const data = await response.json();
            if (!response.ok || !data.order || !data.cart)
              throw new Error(data.error ?? "Checkout failed");
            setCart(data.cart);
            setOrders((current) => [data.order, ...current]);
            toast(`Order #${data.order.id} placed. Thank you!`);
            setRecipeOpen(false);
            setView("orders");
          } catch {
            toast("Checkout could not be completed. Please try again.");
          } finally {
            setBusy(false);
          }
        }, [toast]);

        const checkout = useCallback(async () => {
          if (!authChecked) {
            try {
              const response = await fetch("/api/auth/me", {
                cache: "no-store",
              });
              const data = await response.json();
              setUser(data.user);
              setAuthChecked(true);
              if (data.user) {
                void placeOrder();
                return;
              }
            } catch {
              setAuthChecked(true);
            }
          }
          if (!user) {
            setAuthOpen(true);
            return;
          }
          void placeOrder();
        }, [authChecked, user, placeOrder]);

        const authenticateAndCheckout = useCallback(
          (authenticatedUser) => {
            setUser(authenticatedUser);
            setAuthOpen(false);
            toast(
              `Welcome, ${authenticatedUser.fullName.split(" ")[0]}. Placing your order…`,
            );
            void placeOrder();
          },
          [placeOrder, toast],
        );

        const signOut = useCallback(async () => {
          try {
            await fetch("/api/auth/logout", { method: "POST" });
          } finally {
            setUser(null);
            setOrders([]);
            toast("You have signed out.");
          }
        }, [toast]);

        return (
          <div className="mx-auto flex min-h-screen w-full max-w-[1720px] gap-4 px-3 pb-32 pt-1 sm:gap-5 sm:px-5 lg:pb-12">
            <Sidebar view={view} onChange={navigate} cartCount={cart.count} />

            <div className="flex min-w-0 flex-1 flex-col">

                onToggleFilters={() => {

              <div className="flex-1 pt-2">
                <main className="min-w-0">
                  <LeftColumn
                    view={view}
                    recipes={recipes}
                    filtered={filtered}
                    filter={filter}
                    search={search}
                    onFilter={(category) => {
                      setFilter(category);

                    }}
                    selectedSlug={recipe?.slug ?? null}
                    onSelect={selectRecipe}
                    onToggleFavorite={toggleFavorite}
                    onChangeView={navigate}
                    cart={cart}
                    orders={orders}
                    shopProducts={shopProducts}
                    onAddProduct={(id, quantity) => addProduct(id, quantity)}
                    user={user}
                    onSignOut={signOut}
                    onToast={toast}
                    onOpenTerms={() => setTermsOpen(true)}
                    busy={busy}
                    onUpdateQty={(endpoint, quantity) =>
                      cartRequest(endpoint, {
                        method: "PATCH",
                        body: JSON.stringify({ quantity }),
                      })
                    }
                    onRemove={(endpoint) =>
                      cartRequest(
                        endpoint,
                        { method: "DELETE" },
                        "Removed from cart",

                    }
                    onClear={() =>
                      cartRequest(
                        "/api/cart",
                        { method: "DELETE" },
                        "Cart cleared",
                      )
                    }
                    onCheckout={checkout}
                  />
                </main>
              </div>
              <Footer
                onNavigate={navigate}
                onOpenTerms={() => setTermsOpen(true)}
              />
            </div>

            {recipe && !recipeOpen && view === "recipes" && (
              <RecipeDock
                recipe={recipe}
                onOpen={() => setRecipeOpen(true)}
                dockVisible={dockVisible}
              />
            )}

            {recipe && recipeOpen && (
              <div
                className="fixed inset-0 z-[60] grid place-items-center bg-stone-950/35 px-2 py-3 backdrop-blur-[3px] sm:px-6 sm:py-6"
                role="presentation"
                onMouseDown={(event) => {
                  if (event.target === event.currentTarget)
                    setRecipeOpen(false);
                }}
              >
                <div
                  id="recipe-sheet"
                  role="dialog"
                  aria-modal="true"
                  aria-labelledby="recipe-sheet-title"
                  className="animate-sheet-in relative max-h-[94vh] w-full max-w-[1100px] overflow-y-auto rounded-[26px] shadow-[0_30px_100px_rgba(50,30,15,0.25)] sm:max-h-[92vh]"
                >
                  <button

                    aria-label="Close recipe"
                    className="sticky top-3 z-30 float-right mr-3 mt-3 -mb-12 flex h-10 w-10 items-center justify-center rounded-full border border-orange-100 bg-white/95 text-stone-600 shadow-md backdrop-blur transition-colors duration-500 hover:text-brand-600"

                    <CloseIcon width={19} height={19} />
                  </button>

                    onHome={() => {
                      setRecipeOpen(false);
                      navigate("home");
                    }}
                    onRecipes={() => {
                      setRecipeOpen(false);
                      navigate("recipes");
                    }}
                  />
                </div>
              </div>
            )}

            {authOpen && (
              <CheckoutAuthModal
                onClose={() => setAuthOpen(false)}
                onAuthenticated={authenticateAndCheckout}
                onOpenTerms={() => setTermsOpen(true)}
              />
            )}
            {termsOpen && <TermsModal onClose={() => setTermsOpen(false)} />}

            <div
              className={`pointer-events-none fixed bottom-20 left-1/2 z-[90] flex -translate-x-1/2 flex-col items-center gap-2 transition-[bottom] duration-500 ${dockVisible ? "lg:bottom-28" : "lg:bottom-6"}`}

              {toasts.map((item) => (
                <div

                  <span className="flex h-5 w-5 items-center justify-center rounded-full bg-brand-500">
                    <CheckIcon width={12} height={12} strokeWidth={3} />
                  </span>
                  {item.message}
                </div>
              ))}
            </div>
          </div>
        );

      function scaleQuantity(qty, factor) {
        const m = qty.match(/^(\d+(?:\.\d+)?)\s*(.*)$/);
        if (!m) return qty;
        const n = parseFloat(m[1]) * factor;
        const unit = m[2];
        const rounded = n >= 10 ? Math.round(n) : Math.round(n * 2) / 2;
        let fixedUnit = unit;
        if (rounded !== 1 && /^pc$/.test(unit)) fixedUnit = "pcs";
        if (rounded === 1 && /^pcs$/.test(unit)) fixedUnit = "pc";
        return `${rounded} ${fixedUnit}`.trim();
      }

      function inr(n) {
        return `₹ ${n.toLocaleString("en-IN")}`;
      }

      // ---- in-browser data layer (replaces /api routes + PostgreSQL) -------------
      const STORE_KEY = "flavour-forge-standalone-v1";
      const FAVORITES_RESET_KEY = "flavour-forge-favorites-cleared-v1";

      function buildCatalog() {
        const ingredientRows = INGREDIENTS.map((i, idx) => ({
          id: idx + 1,
          ...i,
        }));
        const ingBySlug = new Map(ingredientRows.map((i) => [i.slug, i.id]));
        const productRows = [];
        for (const [slug, list] of Object.entries(PRODUCTS)) {
          for (const p of list) {
            productRows.push({
              id: productRows.length + 1,
              ingredientId: ingBySlug.get(slug),
              name: p.name,
              size: p.size,
              price: p.price,
              badge: p.badge ?? null,
              isDefault: p.isDefault ?? false,
            });
          }
        }
        let riId = 0;
        const recipeRows = RECIPES.map((r, idx) => ({
          id: idx + 1,
          ...r,
          tags: [...r.tags],
          instructions: [...r.instructions],
          ingredientLinks: r.ingredients.map((ri, position) => ({
            id: ++riId,
            ingredientId: ingBySlug.get(ri[0]),
            quantity: ri[1],
            note: ri[2] ?? null,
            position,
          })),
        }));
        return { ingredientRows, productRows, recipeRows };
      }
      const CATALOG = buildCatalog();

      function loadStore() {
        try {
          const raw = localStorage.getItem(STORE_KEY);
          if (raw) {
            const saved = JSON.parse(raw);
            saved.recipeCart ??= [];
            saved.seq ??= {};
            saved.seq.recipeCart ??= 0;
            if (!localStorage.getItem(FAVORITES_RESET_KEY)) {
              saved.favorites = [];
              localStorage.setItem(STORE_KEY, JSON.stringify(saved));
              localStorage.setItem(FAVORITES_RESET_KEY, "1");
            }
            return saved;
          }
          localStorage.setItem(FAVORITES_RESET_KEY, "1");
        } catch {}
        return {
          cart: [],
          recipeCart: [],
          favorites: [],
          users: [],
          sessions: [],
          orders: [],
          tickets: [],
          seq: { cart: 0, recipeCart: 0, user: 0, order: 0, ticket: 0 },
        };
      }
      let STORE = loadStore();
      function save() {
        try {
          localStorage.setItem(STORE_KEY, JSON.stringify(STORE));
        } catch {}
      }
      const nextId = (key) => (STORE.seq[key] = (STORE.seq[key] ?? 0) + 1);

      const ingredientById = (id) =>
        CATALOG.ingredientRows.find((i) => i.id === id);
      const productById = (id) => CATALOG.productRows.find((p) => p.id === id);

      function recipeSummary(r) {
        return {
          id: r.id,
          slug: r.slug,
          name: r.name,
          description: r.description,
          image: r.image,
          cuisine: r.cuisine,
          ingredientNames: r.ingredientLinks
            .map((l) => ingredientById(l.ingredientId)?.name)
            .filter(Boolean),
          tags: r.tags,
          prepTime: r.prepTime,
          cookTime: r.cookTime,
          servings: r.servings,
          difficulty: r.difficulty,
          isFavorite: STORE.favorites.includes(r.id),
        };
      }
      function recipeDetail(r) {
        return {
          ...recipeSummary(r),
          about: r.about,
          instructions: r.instructions,
          calories: r.calories,
          protein: r.protein,
          carbs: r.carbs,
          fat: r.fat,
          ingredients: r.ingredientLinks.map((l) => {
            const ing = ingredientById(l.ingredientId);
            return {
              id: l.id,
              ingredientId: ing.id,
              slug: ing.slug,
              name: ing.name,
              emoji: ing.emoji,
              about: ing.about,
              quantity: l.quantity,
              note: l.note,
              products: CATALOG.productRows.filter(
                (p) => p.ingredientId === ing.id,
              ),
            };
          }),
        };
      }
      function cartState() {
        const productItems = STORE.cart.map((c) => {
          const p = productById(c.productId);
          return {
            id: c.id,
            key: "product-" + c.id,
            type: "product",
            productId: c.productId,
            quantity: c.quantity,
            name: p.name,
            size: p.size,
            price: p.price,
            emoji: ingredientById(p.ingredientId).emoji,
          };
        });
        const recipeItems = STORE.recipeCart.map((c) => {
          const r = CATALOG.recipeRows.find(
            (recipe) => recipe.id === c.recipeId,
          );
          return {
            id: c.id,
            key: "recipe-" + c.id,
            type: "recipe",
            recipeId: c.recipeId,
            quantity: c.quantity,
            servings: c.servings,
            price: c.price,
            ingredientCount: c.ingredientCount,
            name: r.name,
            image: r.image,
            slug: r.slug,
          };
        });
        const items = [...recipeItems, ...productItems];
        return {
          items,
          total: items.reduce(
            (sum, item) => sum + item.price * item.quantity,
            0,
          ),
          count: items.reduce((sum, item) => sum + item.quantity, 0),
        };
      }
      function addRecipeKit(recipeId, servings) {
        const recipe = CATALOG.recipeRows.find((r) => r.id === recipeId);
        if (!recipe) return false;
        const safeServings = Math.max(
          1,
          Math.min(20, Number(servings) || recipe.servings),
        );
        const multiplier = Math.max(
          1,
          Math.ceil(safeServings / recipe.servings),
        );
        const price = recipe.ingredientLinks.reduce((sum, link) => {
          const options = CATALOG.productRows.filter(
            (p) => p.ingredientId === link.ingredientId,
          );
          return (
            sum +
            (options.find((p) => p.isDefault)?.price ??
              options[0]?.price ??
              0) *
              multiplier
          );
        }, 0);
        const existing = STORE.recipeCart.find(
          (item) =>
            item.recipeId === recipeId && item.servings === safeServings,
        );
        if (existing) {
          existing.quantity += 1;
          existing.price = price;
        } else
          STORE.recipeCart.push({
            id: nextId("recipeCart"),
            recipeId,
            servings: safeServings,
            quantity: 1,
            price,
            ingredientCount: recipe.ingredientLinks.length,
          });
        return true;
      }
      function addToCart(productId, quantity) {
        if (!productById(productId)) return;
        const qty = Math.max(1, Math.min(99, Number(quantity) || 1));
        const existing = STORE.cart.find((c) => c.productId === productId);
        if (existing) existing.quantity += qty;
        else STORE.cart.push({ id: nextId("cart"), productId, quantity: qty });
      }

      async function hashPassword(password) {
        try {
          const bytes = await crypto.subtle.digest(
            "SHA-256",
            new TextEncoder().encode("flavour-forge::" + password),
          );
          return (
            "sha256:" +
            Array.from(new Uint8Array(bytes), (b) =>
              b.toString(16).padStart(2, "0"),
            ).join("")
          );
        } catch {
          let h = 2166136261;
          for (const ch of password)
            h = Math.imul(h ^ ch.charCodeAt(0), 16777619) >>> 0;
          return "fnv:" + h.toString(16);
        }
      }
      function currentUser() {
        const session = STORE.sessions[0];
        if (!session || session.expiresAt < Date.now()) return null;
        const u = STORE.users.find((x) => x.id === session.userId);
        return u ? { id: u.id, fullName: u.fullName, email: u.email } : null;
      }
      function startSession(userId) {
        STORE.sessions = [
          { userId, expiresAt: Date.now() + 14 * 24 * 60 * 60 * 1000 },
        ];
      }

      const json = (body, status = 200) =>
        new Response(JSON.stringify(body), {
          status,
          headers: { "Content-Type": "application/json" },
        });
      const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

      async function handleRequest(method, url, body) {
        const path = url.replace(/^https?:\/\/[^/]+/, "").split("?")[0];
        let m;

        if (path === "/api/health") return json({ ok: true });
        if (path === "/api/recipes")
          return json(CATALOG.recipeRows.map(recipeSummary));
        if ((m = path.match(/^\/api\/recipes\/([^/]+)$/))) {
          const r = CATALOG.recipeRows.find(
            (x) => x.slug === decodeURIComponent(m[1]),
          );
          return r ? json(recipeDetail(r)) : json({ error: "Not found" }, 404);
        }
        if (path === "/api/products") {
          return json(
            CATALOG.productRows
              .map((p) => ({
                ...p,
                ingredientName: ingredientById(p.ingredientId).name,
                emoji: ingredientById(p.ingredientId).emoji,
              }))
              .sort(
                (a, b) =>
                  a.ingredientName.localeCompare(b.ingredientName) ||
                  a.id - b.id,
              ),
          );
        }

        if (path === "/api/cart") {
          if (method === "POST") {
            if (body?.recipeId != null) {
              if (!addRecipeKit(Number(body.recipeId), body.servings))
                return json({ error: "Recipe not found" }, 404);
            } else {
              const items =
                body?.items ??
                (body?.productId
                  ? [
                      {
                        productId: body.productId,
                        quantity: body.quantity ?? 1,
                      },
                    ]
                  : []);
              for (const item of items)
                addToCart(Number(item.productId), item.quantity ?? 1);
            }
          } else if (method === "DELETE") {
            STORE.cart = [];
            STORE.recipeCart = [];
          }
          save();
          return json(cartState());
        }
        if ((m = path.match(/^\/api\/cart\/recipe\/(\d+)$/))) {
          const id = Number(m[1]);
          if (method === "PATCH") {
            const quantity = Math.min(99, Math.max(0, Number(body?.quantity)));
            if (quantity <= 0)
              STORE.recipeCart = STORE.recipeCart.filter(
                (item) => item.id !== id,
              );
            else
              STORE.recipeCart = STORE.recipeCart.map((item) =>
                item.id === id ? { ...item, quantity } : item,
              );
          } else if (method === "DELETE")
            STORE.recipeCart = STORE.recipeCart.filter(
              (item) => item.id !== id,
            );
          save();
          return json(cartState());
        }
        if ((m = path.match(/^\/api\/cart\/(\d+)$/))) {
          const id = Number(m[1]);
          if (method === "PATCH") {
            const qty = Math.min(99, Number(body?.quantity));
            if (qty <= 0) STORE.cart = STORE.cart.filter((c) => c.id !== id);
            else
              STORE.cart = STORE.cart.map((c) =>
                c.id === id ? { ...c, quantity: qty } : c,
              );
          } else if (method === "DELETE")
            STORE.cart = STORE.cart.filter((c) => c.id !== id);
          save();
          return json(cartState());
        }

        if (path === "/api/favorites" && method === "POST") {
          const id = Number(body?.recipeId);
          const has = STORE.favorites.includes(id);
          STORE.favorites = has
            ? STORE.favorites.filter((x) => x !== id)
            : [...STORE.favorites, id];
          save();
          return json({ recipeId: id, isFavorite: !has });
        }

        if (path === "/api/auth/me") return json({ user: currentUser() });
        if (path === "/api/auth/logout") {
          STORE.sessions = [];
          save();
          return json({ ok: true });
        }
        if (path === "/api/auth/register" && method === "POST") {
          const fullName = String(body?.fullName ?? "")
            .trim()
            .replace(/\s+/g, " ");
          const email = String(body?.email ?? "")
            .trim()
            .toLowerCase();
          const password = String(body?.password ?? "");
          if (fullName.length < 2 || fullName.length > 80)
            return json({ error: "Enter your name (2–80 characters)." }, 400);
          if (!EMAIL_RE.test(email) || email.length > 254)
            return json({ error: "Enter a valid email address." }, 400);
          if (password.length < 8 || password.length > 72)
            return json(
              { error: "Password must be between 8 and 72 characters." },
              400,
            );
          if (body?.acceptTerms !== true)
            return json(
              {
                error:
                  "Please accept the Terms & Conditions to create an account.",
              },
              400,
            );
          if (STORE.users.some((u) => u.email === email))
            return json(
              {
                error:
                  "An account with that email already exists. Sign in instead.",
              },
              409,
            );
          const user = {
            id: nextId("user"),
            fullName,
            email,
            passwordHash: await hashPassword(password),
            acceptedTermsAt: new Date().toISOString(),
            createdAt: new Date().toISOString(),
          };
          STORE.users.push(user);
          startSession(user.id);
          save();
          return json({ user: { id: user.id, fullName, email } });
        }
        if (path === "/api/auth/login" && method === "POST") {
          const email = String(body?.email ?? "")
            .trim()
            .toLowerCase();
          const password = String(body?.password ?? "");
          if (!email || !password)
            return json({ error: "Enter your email and password." }, 400);
          const user = STORE.users.find((u) => u.email === email);
          if (!user || user.passwordHash !== (await hashPassword(password)))
            return json({ error: "Email or password is incorrect." }, 401);
          startSession(user.id);
          save();
          return json({
            user: { id: user.id, fullName: user.fullName, email: user.email },
          });
        }

        if (path === "/api/orders") {
          const user = currentUser();
          if (method === "GET")
            return json(
              user
                ? STORE.orders
                    .filter((o) => o.userId === user.id)
                    .slice()
                    .reverse()
                    .slice(0, 20)
                : [],
            );
          if (!user)
            return json(
              { error: "Create an account or sign in to check out." },
              401,
            );
          const cart = cartState();
          if (cart.items.length === 0)
            return json({ error: "Cart is empty" }, 400);
          const order = {
            id: nextId("order"),
            userId: user.id,
            customerName: user.fullName,
            customerEmail: user.email,
            total: cart.total,
            itemCount: cart.count,
            items: JSON.stringify(cart.items),
            createdAt: new Date().toISOString(),
          };
          STORE.orders.push(order);
          STORE.cart = [];
          STORE.recipeCart = [];
          save();
          return json({ order, cart: cartState() });
        }

        if (path === "/api/support") {
          const user = currentUser();
          if (method === "GET")
            return json(
              user
                ? STORE.tickets
                    .filter((t) => t.userId === user.id)
                    .slice()
                    .reverse()
                    .slice(0, 20)
                : [],
            );
          const name = String(body?.name ?? user?.fullName ?? "").trim();
          const email = String(body?.email ?? user?.email ?? "")
            .trim()
            .toLowerCase();
          const subject = String(body?.subject ?? "").trim();
          const message = String(body?.message ?? "").trim();
          const orderRef =
            String(body?.orderRef ?? "")
              .trim()
              .slice(0, 40) || null;
          const category = [
            "order",
            "delivery",
            "payment",
            "recipe",
            "account",
            "general",
          ].includes(body?.category)
            ? body.category
            : "general";
          if (name.length < 2 || name.length > 80)
            return json({ error: "Enter your name." }, 400);
          if (!EMAIL_RE.test(email))
            return json({ error: "Enter a valid email so we can reply." }, 400);
          if (subject.length < 3 || subject.length > 120)
            return json(
              { error: "Add a short subject (3–120 characters)." },
              400,
            );
          if (message.length < 10 || message.length > 2000)
            return json(
              { error: "Tell us a little more (10–2000 characters)." },
              400,
            );
          const ticket = {
            id: nextId("ticket"),
            userId: user?.id ?? null,
            name,
            email,
            category,
            subject,
            message,
            orderRef,
            status: "open",
            createdAt: new Date().toISOString(),
          };
          STORE.tickets.push(ticket);
          save();
          return json({ ticket });
        }

        return json({ error: "Not found" }, 404);
      }

      // Route the components' fetch("/api/...") calls to the in-browser store.
      const realFetch = window.fetch.bind(window);
      window.fetch = (input, init = {}) => {
        const url = typeof input === "string" ? input : input.url;
        if (!url.includes("/api/")) return realFetch(input, init);
        const method = (init.method ?? "GET").toUpperCase();
        let body = null;
        if (init.body) {
          try {
            body = JSON.parse(init.body);
          } catch {}
        }
        return new Promise((resolve) =>
          setTimeout(() => resolve(handleRequest(method, url, body)), 60),
        );
      };

      // ---- boot (mirrors src/app/page.jsx) --------------------------------------
      (async function boot() {
        const recipes = await (await fetch("/api/recipes")).json();
        const slug =
          recipes.find((r) => r.slug === "chicken-biryani")?.slug ??
          recipes[0]?.slug;
        const recipe = slug
          ? await (await fetch("/api/recipes/" + slug)).json()
          : null;
        const cart = await (await fetch("/api/cart")).json();
        ReactDOM.createRoot(document.getElementById("root")).render(
          <App
            initialRecipes={recipes}
            initialRecipe={recipe}
            initialCart={cart}
          />,
        );
      })();
    </script>
  </body>
</html>
